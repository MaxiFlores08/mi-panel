<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panel — Dashboard Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CSS 100% propio — sin CDN externo, para que nada externo
   pueda romper el layout (misma lección aprendida en CargaYa).
   ========================================================= */
:root{
  --bg:#0A0D13; --bg-deep:#05070A;
  --surface:#141922; --surface-2:#1B212C; --surface-3:#232B39;
  --border:#262E3B; --border-soft:#1C232E;
  --text:#EDF0F6; --text-dim:#909BAE; --text-faint:#565F70;
  --violet:#A78BFA; --violet-soft:#8B5CF6; --violet-dim:#241B3D; --violet-glow:rgba(167,139,250,.35);
  --green:#3DE0A0; --green-soft:#34D399; --green-dim:#123A2C;
  --cyan:#3BDCF0; --cyan-dim:#0F3438;
  --amber:#FBBF24; --amber-dim:#3D2F10;
  --red:#FB7185; --red-dim:#3D1520;
  --radius-lg:18px; --radius-md:13px;
  --sp-2:8px; --sp-3:12px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg-deep); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
.mono{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }
input{ font-family:inherit; }

.row{ display:flex; align-items:center; }
.row-between{ display:flex; align-items:center; justify-content:space-between; }
.col{ display:flex; flex-direction:column; }
.g-1{ gap:4px; } .g-2{ gap:8px; } .g-3{ gap:12px; }
.flex-1{ flex:1 1 0%; min-width:0; }
.shrink-0{ flex-shrink:0; }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hide{ display:none !important; }

.app-shell{
  position:relative; min-height:100vh; overflow-x:hidden;
  background: var(--bg);
}
.bg-glow{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg-glow::before, .bg-glow::after{
  content:''; position:absolute; width:60vw; height:60vw; max-width:700px; max-height:700px; border-radius:50%; filter:blur(80px); opacity:.16;
}
.bg-glow::before{ top:-10%; left:-10%; background:var(--violet-soft); animation:driftA 22s ease-in-out infinite alternate; }
.bg-glow::after{ bottom:-15%; right:-10%; background:var(--green-soft); animation:driftB 26s ease-in-out infinite alternate; }
@keyframes driftA{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(8%,6%) scale(1.15); } }
@keyframes driftB{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(-6%,-8%) scale(1.1); } }

.dashboard-shell{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:20px 20px 56px; }
.dashboard-grid{ display:grid; grid-template-columns:1fr 300px; gap:20px 24px; align-items:start; }
@media (max-width:880px){ .dashboard-grid{ grid-template-columns:1fr; } }

.card{ background:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); border:1px solid var(--border); border-radius:var(--radius-lg); transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
@media (hover:hover){ .card.hoverable:hover{ transform:translateY(-2px); border-color:var(--border-hi, #333f52); box-shadow:0 14px 34px -14px rgba(0,0,0,.55); } }
.stagger{ opacity:0; animation:fadeIn .5s cubic-bezier(.22,1,.36,1) forwards; }
.stagger:nth-child(1){ animation-delay:.05s; } .stagger:nth-child(2){ animation-delay:.12s; }
.stagger:nth-child(3){ animation-delay:.19s; } .stagger:nth-child(4){ animation-delay:.26s; }

/* Sidebar */
.sidebar{ display:flex; flex-direction:column; gap:16px; }
.side-widget-title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; margin:0 0 12px; }
.side-link{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:13px; margin-bottom:8px;
  background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); text-decoration:none;
  font-size:13px; font-weight:700; transition:transform .15s ease, border-color .15s ease, background .15s ease;
}
.side-link:last-child{ margin-bottom:0; }
.side-link:hover{ border-color:var(--violet-soft); background:var(--surface-3); transform:translateX(3px); }
.side-link:active{ transform:scale(.98); }
.side-link .ic{ width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--surface-3); flex-shrink:0; }
.side-link .arrow{ margin-left:auto; opacity:.5; }
.side-widget-sub{ font-size:11px; color:var(--text-faint); margin:-6px 0 12px; line-height:1.5; }

.clock{ font-size:13px; font-weight:700; color:var(--violet-soft); }
.clock-dot{ display:inline-block; width:6px; height:6px; border-radius:99px; background:var(--green-soft); margin-right:6px; animation:pulse 1.8s ease-in-out infinite; box-shadow:0 0 8px 1px rgba(61,224,160,.5); }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

.header{ padding:4px 0 0; margin-bottom:16px; }
.brand-title{ font-size:22px; font-weight:800; letter-spacing:-.01em; margin:0; }
.brand-date{ font-size:13px; font-weight:500; color:var(--text-dim); margin:4px 0 0; text-transform:capitalize; }
.section-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); }
.divider{ height:1px; background:linear-gradient(90deg, transparent, var(--border), transparent); }

/* Selector de contexto */
.context-bar{ display:flex; gap:6px; padding:4px; }
.context-btn{ flex:1; padding:10px 8px; border-radius:12px; font-size:12px; font-weight:700; color:var(--text-faint); transition:all .18s ease; text-align:center; }
.context-btn.active{ color:#1a0e33; background:linear-gradient(180deg,#C4B5FD,var(--violet-soft)); box-shadow:0 4px 16px -4px var(--violet-glow); }
.context-btn:active{ transform:scale(.96); }

.main-col{ display:flex; flex-direction:column; gap:16px; margin-bottom:20px; }

/* Metas */
.meta-row{ display:flex; align-items:center; gap:10px; padding:10px 0; }
.checkbox{ width:24px; height:24px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s ease; }
.checkbox.checked{ background:var(--green-soft); border-color:var(--green-soft); }
.meta-input{ flex:1; min-width:0; background:none; border:none; color:var(--text); font-size:14px; padding:6px 0; border-bottom:1.5px solid var(--border-soft); transition:border-color .15s ease; }
.meta-input:focus{ outline:none; border-color:var(--violet-soft); }
.meta-input.done{ color:var(--text-faint); text-decoration:line-through; }
.progress-track{ background:var(--surface-3); border-radius:99px; overflow:hidden; height:8px; }
.progress-fill{ height:100%; border-radius:99px; transition:width .4s cubic-bezier(.22,1,.36,1); background:linear-gradient(90deg,#C4B5FD,var(--violet-soft)); }

/* Hábitos */
.habit-row{ display:flex; align-items:center; gap:12px; padding:12px 0; }
.habit-icon{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; background:var(--surface-3); }
.habit-label{ flex:1; font-size:14px; font-weight:600; }
.habit-label.done{ color:var(--text-faint); text-decoration:line-through; }
.toggle{ width:46px; height:27px; border-radius:99px; background:var(--surface-3); border:1.5px solid var(--border); position:relative; transition:background .2s ease, border-color .2s ease; flex-shrink:0; }
.toggle-dot{ position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--text-faint); transition:transform .2s cubic-bezier(.22,1,.36,1), background .2s ease; }
.toggle.on{ background:var(--green-dim); border-color:var(--green-soft); }
.toggle.on .toggle-dot{ transform:translateX(19px); background:var(--green-soft); }

/* Rutina / timeline */
.day-tabs{ display:flex; gap:4px; overflow-x:auto; padding:4px 0; scrollbar-width:none; }
.day-tabs::-webkit-scrollbar{ display:none; }
.day-tab{ flex-shrink:0; padding:8px 14px; border-radius:11px; font-size:12px; font-weight:700; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border-soft); transition:all .15s ease; }
.day-tab.active{ color:var(--text); background:var(--surface-3); border-color:var(--violet-soft); }

.timeline{ position:relative; padding-left:20px; }
.timeline::before{ content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--border); }
.tl-item{ position:relative; padding-bottom:18px; opacity:1; transition:opacity .25s ease; }
.tl-item:last-child{ padding-bottom:0; }
.tl-item.dim{ opacity:.35; }
.tl-dot{ position:absolute; left:-20px; top:3px; width:12px; height:12px; border-radius:50%; border:2px solid var(--bg); box-shadow:0 0 0 2px var(--border); }
.tl-time{ font-size:11px; font-weight:700; margin:0 0 2px; }
.tl-label{ font-size:14px; font-weight:600; margin:0; }
.tl-empty{ padding:24px 0; text-align:center; color:var(--text-faint); font-size:13px; }

.empty-icon{ width:36px; height:36px; opacity:.4; color:var(--text-faint); }

.toast{ pointer-events:auto; margin-bottom:8px; border-radius:16px; padding:12px 16px; font-size:14px; font-weight:600; background:var(--surface-3); border:1px solid var(--border); color:var(--text); box-shadow:0 12px 30px -8px rgba(0,0,0,.6); display:flex; align-items:center; gap:8px; animation:toastIn .3s cubic-bezier(.22,1,.36,1), toastOut .25s ease 2.3s forwards; }
@keyframes toastIn{ from{opacity:0; transform:translateY(-10px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes toastOut{ to{opacity:0; transform:translateY(-8px) scale(.97);} }
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.fade-in{ animation:fadeIn .35s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

@media (prefers-reduced-motion:reduce){ *{ animation-duration:.001s !important; transition-duration:.001s !important; } }
</style>
</head>
<body>

<div class="app-shell">
  <div class="bg-glow"></div>

  <div id="toastHost" style="position:fixed; left:50%; top:12px; z-index:60; transform:translateX(-50%); width:90%; max-width:460px; pointer-events:none;"></div>

  <div class="dashboard-shell">

    <!-- Header -->
    <header class="header row-between">
      <div>
        <p class="brand-title">Hola 👋</p>
        <p id="fechaHoy" class="brand-date">—</p>
      </div>
      <div class="row g-3">
        <p class="clock mono"><span class="clock-dot"></span><span id="relojVivo">--:--</span></p>
        <button id="syncBadge" style="width:36px; height:36px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;" title="Actualizar datos">
          <svg id="syncIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.35M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <div class="card context-bar" style="margin-bottom:18px;">
      <button data-context="local" class="context-btn">🏠 Local</button>
      <button data-context="cursada" class="context-btn">🎓 Cursada</button>
      <button data-context="estudio" class="context-btn">💻 Estudio</button>
    </div>

    <div class="dashboard-grid">
      <main class="main-col">

        <!-- Metas innegociables -->
        <section class="card stagger hoverable" style="padding:16px;">
          <div class="row-between" style="margin-bottom:4px;">
            <p class="section-label">Metas innegociables de hoy</p>
            <p id="metasCount" class="mono" style="font-size:11px; font-weight:700; color:var(--text-dim);">0/3</p>
          </div>
          <div class="progress-track" style="margin:10px 0 6px;">
            <div id="metasProgress" class="progress-fill" style="width:0%;"></div>
          </div>
          <div id="metasList"></div>
        </section>

        <!-- Hábitos -->
        <section class="card stagger hoverable" style="padding:16px;">
          <p class="section-label" style="margin-bottom:6px;">Hábitos de hoy</p>
          <div id="habitosList"></div>
        </section>

        <!-- Rutina semanal -->
        <section class="card stagger hoverable" style="padding:16px;">
          <p class="section-label" style="margin-bottom:10px;">Rutina semanal</p>
          <div id="dayTabs" class="day-tabs"></div>
          <div id="timelineHost" class="timeline" style="margin-top:16px;"></div>
        </section>

      </main>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="card stagger hoverable" style="padding:16px;">
          <p class="side-widget-title">🏪 Negocio</p>
          <p class="side-widget-sub">Accesos rápidos a lo que ya tenés armado.</p>
          <a class="side-link" href="https://trello.com/b/woDKeVha/turnos-de-hospital" target="_blank" rel="noopener">
            <span class="ic">🏥</span> Turnos Hospital <span class="arrow">↗</span>
          </a>
          <a class="side-link" href="https://cargaya-app.vercel.app/" target="_blank" rel="noopener">
            <span class="ic">🔌</span> Accesorios <span class="arrow">↗</span>
          </a>
        </div>
      </aside>
    </div>

  </div>
</div>

<script>
'use strict';

/* =========================================================
   1. DATOS BASE — rutina fija de la semana
   ========================================================= */
const DIAS = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DIAS_LABEL = { lunes:'Lun', martes:'Mar', miercoles:'Mié', jueves:'Jue', viernes:'Vie', sabado:'Sáb', domingo:'Dom' };
const DIAS_LARGO = { lunes:'lunes', martes:'martes', miercoles:'miércoles', jueves:'jueves', viernes:'viernes', sabado:'sábado', domingo:'domingo' };

// type: 'negocio' | 'cursada' | 'estudio' | 'viaje'
const RUTINA = {
  lunes: [
    { hora:'15:00 – 16:00', label:'Viaje a la facultad', type:'viaje', icon:'🚌' },
    { hora:'16:00 – 22:00', label:'Cursada', type:'cursada', icon:'🎓' },
  ],
  martes: [
    { hora:'08:30 – 13:00', label:'Negocio (turno mañana)', type:'negocio', icon:'🏠' },
    { hora:'13:00 – 17:00', label:'Entrenamiento / Estudio', type:'estudio', icon:'💻' },
    { hora:'17:00 – 20:30', label:'Negocio (turno tarde)', type:'negocio', icon:'🏠' },
  ],
  miercoles: [
    { hora:'08:30 – 13:00', label:'Negocio (turno mañana)', type:'negocio', icon:'🏠' },
    { hora:'17:00 – 22:00', label:'Cursada', type:'cursada', icon:'🎓' },
  ],
  jueves: [
    { hora:'08:30 – 13:00', label:'Negocio (turno mañana)', type:'negocio', icon:'🏠' },
    { hora:'17:00 – 22:00', label:'Cursada', type:'cursada', icon:'🎓' },
  ],
  viernes: [
    { hora:'08:30 – 13:00', label:'Negocio (turno mañana)', type:'negocio', icon:'🏠' },
    { hora:'13:00 – 17:00', label:'Entrenamiento / Estudio', type:'estudio', icon:'💻' },
    { hora:'17:00 – 20:30', label:'Negocio (turno tarde)', type:'negocio', icon:'🏠' },
  ],
  sabado: [],
  domingo: [],
};

const TYPE_COLOR = {
  negocio:'var(--green-soft)', cursada:'var(--violet-soft)', estudio:'var(--cyan)', viaje:'var(--amber)',
};

// Qué tipos de bloque resalta cada modo de contexto
const CONTEXT_HIGHLIGHT = {
  local:   ['negocio'],
  cursada: ['cursada','viaje'],
  estudio: ['estudio'],
};

/* =========================================================
   2. STORE — habla con /api/data (Turso) vía clave-valor genérico,
   con caché en memoria para lecturas instantáneas.
   ========================================================= */
const Store = (() => {
  const API = '/api/data';
  let cache = {};

  async function refresh(){
    const res = await fetch(API);
    if (!res.ok) throw new Error('No se pudo conectar con la base de datos');
    cache = await res.json();
  }

  async function set(key, value){
    cache[key] = value; // optimista: actualiza ya mismo la UI
    const res = await fetch(API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value }),
    });
    if (!res.ok) throw new Error('No se pudo guardar en la base de datos');
  }

  const todayKey = () => 'focus:' + new Date().toISOString().slice(0, 10);

  function getFocusHoy(){
    return cache[todayKey()] || {
      metas: [
        { texto:'', done:false },
        { texto:'', done:false },
        { texto:'', done:false },
      ],
      habitos: { entrenamiento:false, codigo:false, gastos:false },
    };
  }
  async function setFocusHoy(data){
    await set(todayKey(), data);
  }
  function getContext(){ return cache.contextMode || 'local'; }
  async function setContext(v){ await set('contextMode', v); }
  function getDiaSeleccionado(){
    return cache.diaSeleccionado || DIAS[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];
  }
  async function setDiaSeleccionado(v){ await set('diaSeleccionado', v); }

  return { refresh, getFocusHoy, setFocusHoy, getContext, setContext, getDiaSeleccionado, setDiaSeleccionado };
})();

/* =========================================================
   3. RENDER
   ========================================================= */
const HABITOS_DEF = [
  { key:'entrenamiento', label:'Entrenamiento', icon:'🏋️' },
  { key:'codigo', label:'Avance en código', icon:'💻' },
  { key:'gastos', label:'Control de gastos', icon:'💸' },
];

function renderFecha(){
  const d = new Date();
  const txt = d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('fechaHoy').textContent = txt;
}

function tickReloj(){
  const el = document.getElementById('relojVivo');
  if (el) el.textContent = new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
setInterval(tickReloj, 1000);
tickReloj();

function renderContextBar(activeOverride){
  const active = activeOverride || Store.getContext();
  document.querySelectorAll('.context-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.context === active);
  });
}

function renderMetas(){
  const data = Store.getFocusHoy();
  const host = document.getElementById('metasList');
  host.innerHTML = '';

  data.metas.forEach((meta, i) => {
    const row = document.createElement('div');
    row.className = 'meta-row';
    row.innerHTML = `
      <div class="checkbox ${meta.done ? 'checked' : ''}" data-action="toggle-meta" data-i="${i}">
        ${meta.done ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#06231a" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>' : ''}
      </div>
      <input type="text" class="meta-input ${meta.done ? 'done' : ''}" data-action="edit-meta" data-i="${i}"
             placeholder="Meta innegociable #${i + 1}" value="${escapeHtml(meta.texto)}">
    `;
    host.appendChild(row);
  });

  const done = data.metas.filter(m => m.done).length;
  document.getElementById('metasCount').textContent = `${done}/3`;
  document.getElementById('metasProgress').style.width = (done / 3 * 100) + '%';
}

function renderHabitos(){
  const data = Store.getFocusHoy();
  const host = document.getElementById('habitosList');
  host.innerHTML = '';

  HABITOS_DEF.forEach(h => {
    const on = data.habitos[h.key];
    const row = document.createElement('div');
    row.className = 'habit-row';
    row.innerHTML = `
      <div class="habit-icon">${h.icon}</div>
      <p class="habit-label ${on ? 'done' : ''}">${h.label}</p>
      <div class="toggle ${on ? 'on' : ''}" data-action="toggle-habito" data-key="${h.key}">
        <div class="toggle-dot"></div>
      </div>
    `;
    host.appendChild(row);
  });
}

function renderDayTabs(){
  const activo = Store.getDiaSeleccionado();
  const host = document.getElementById('dayTabs');
  host.innerHTML = '';
  DIAS.forEach(dia => {
    const btn = document.createElement('button');
    btn.className = `day-tab ${dia === activo ? 'active' : ''}`;
    btn.dataset.action = 'select-day';
    btn.dataset.dia = dia;
    btn.textContent = DIAS_LABEL[dia];
    host.appendChild(btn);
  });
}

function renderTimeline(){
  const dia = Store.getDiaSeleccionado();
  const context = Store.getContext();
  const highlight = CONTEXT_HIGHLIGHT[context] || [];
  const bloques = RUTINA[dia] || [];
  const host = document.getElementById('timelineHost');
  host.innerHTML = '';

  if (!bloques.length) {
    host.innerHTML = `<p class="tl-empty">Día libre — sin bloques cargados para el ${DIAS_LARGO[dia]}.</p>`;
    return;
  }

  bloques.forEach(b => {
    const dim = highlight.length && !highlight.includes(b.type);
    const item = document.createElement('div');
    item.className = `tl-item ${dim ? 'dim' : ''}`;
    item.innerHTML = `
      <div class="tl-dot" style="background:${TYPE_COLOR[b.type]}"></div>
      <p class="tl-time mono" style="color:${TYPE_COLOR[b.type]}">${b.hora}</p>
      <p class="tl-label">${b.icon} ${b.label}</p>
    `;
    host.appendChild(item);
  });
}

function renderAll(){
  renderFecha();
  renderContextBar();
  renderMetas();
  renderHabitos();
  renderDayTabs();
  renderTimeline();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function toast(msg, kind = 'ok'){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  const dot = document.createElement('span');
  dot.style.color = kind === 'error' ? 'var(--red)' : 'var(--green-soft)';
  dot.textContent = '●';
  el.append(dot, document.createTextNode(' ' + msg));
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function setSyncing(isSyncing){
  document.getElementById('syncIcon').classList.toggle('spin', isSyncing);
}

/* =========================================================
   4. EVENTOS
   ========================================================= */
document.addEventListener('click', async (e) => {
  if (e.target.closest('#syncBadge')) {
    setSyncing(true);
    try { await Store.refresh(); renderAll(); toast('Datos actualizados'); }
    catch (err) { toast('No se pudo actualizar. Revisá tu conexión.', 'error'); }
    setSyncing(false);
    return;
  }

  const ctxBtn = e.target.closest('[data-context]');
  if (ctxBtn) {
    const prev = Store.getContext();
    renderContextBar(ctxBtn.dataset.context); // respuesta visual inmediata
    try {
      await Store.setContext(ctxBtn.dataset.context);
      renderTimeline();
    } catch (err) {
      toast('No se pudo guardar. Revisá tu conexión.', 'error');
      renderContextBar(prev);
    }
    return;
  }

  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const action = actionEl.dataset.action;

  if (action === 'toggle-meta') {
    const i = Number(actionEl.dataset.i);
    const data = Store.getFocusHoy();
    data.metas[i].done = !data.metas[i].done;
    renderMetas(); // optimista
    try { await Store.setFocusHoy(data); }
    catch (err) { toast('No se pudo guardar. Revisá tu conexión.', 'error'); }
  }

  if (action === 'toggle-habito') {
    const key = actionEl.dataset.key;
    const data = Store.getFocusHoy();
    data.habitos[key] = !data.habitos[key];
    renderHabitos(); // optimista
    try { await Store.setFocusHoy(data); }
    catch (err) { toast('No se pudo guardar. Revisá tu conexión.', 'error'); }
  }

  if (action === 'select-day') {
    Store.setDiaSeleccionado(actionEl.dataset.dia); // solo local a la sesión, no crítico
    renderDayTabs();
    renderTimeline();
  }
});

let metaSaveTimer = null;
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-action="edit-meta"]');
  if (!el) return;
  const i = Number(el.dataset.i);
  const data = Store.getFocusHoy();
  data.metas[i].texto = el.value;

  clearTimeout(metaSaveTimer);
  metaSaveTimer = setTimeout(async () => {
    try { await Store.setFocusHoy(data); }
    catch (err) { toast('No se pudo guardar. Revisá tu conexión.', 'error'); }
  }, 500);
});

/* =========================================================
   5. INIT
   ========================================================= */
async function init(){
  setSyncing(true);
  try {
    await Store.refresh();
  } catch (err) {
    toast('No se pudo conectar con la base de datos', 'error');
  }
  setSyncing(false);
  renderAll();
}
init();
</script>
